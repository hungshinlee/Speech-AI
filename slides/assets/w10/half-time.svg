<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 364" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="20.0" y="28.0" font-size="22" font-weight="700" fill="#15803d" text-anchor="start" dominant-baseline="auto">First half — done</text>
<text x="218.9" y="28.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">By what right is each term removed?</text>
<rect x="20.0" y="40.0" width="308.0" height="132.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="46.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="46.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="70.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Anyone speaking?</text>
<text x="34.0" y="110.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">A statistical difference: enough</text>
<text x="34.0" y="135.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">to detect, not to remove. It</text>
<text x="34.0" y="160.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">detects speech — not the user.</text>
<line x1="330.0" y1="106.0" x2="337.0" y2="106.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,106.0 337.0,111.0 337.0,101.0" fill="#94a3b8"/>
<rect x="346.0" y="40.0" width="308.0" height="132.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="372.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="372.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="396.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Our own voice</text>
<text x="360.0" y="110.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">System identification of one</text>
<text x="360.0" y="135.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">linear path. It breaks at</text>
<text x="360.0" y="160.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">double-talk — barge-in.</text>
<line x1="656.0" y1="106.0" x2="663.0" y2="106.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,106.0 663.0,111.0 663.0,101.0" fill="#94a3b8"/>
<rect x="672.0" y="40.0" width="308.0" height="132.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="698.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="698.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="722.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The noise</text>
<text x="686.0" y="110.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Only a prior: statistics, a mask,</text>
<text x="686.0" y="135.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">a generative model. Each</text>
<text x="686.0" y="160.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">trusts it more.</text>
<text x="20.0" y="210.0" font-size="22" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="auto">Second half — next</text>
<text x="245.6" y="210.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What is left behind — and which one is the user?</text>
<rect x="20.0" y="222.0" width="226.5" height="132.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="46.0" cy="252.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="46.0" y="253.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="70.0" y="260.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">What is left</text>
<text x="34.0" y="292.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">It sounds cleaner.</text>
<text x="34.0" y="317.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Does the next model</text>
<text x="34.0" y="342.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">agree?</text>
<line x1="248.5" y1="288.0" x2="255.5" y2="288.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="262.5,288.0 255.5,293.0 255.5,283.0" fill="#94a3b8"/>
<rect x="264.5" y="222.0" width="226.5" height="132.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="290.5" cy="252.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="290.5" y="253.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="314.5" y="260.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Space</text>
<text x="278.5" y="292.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Can we subtract and</text>
<text x="278.5" y="317.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">leave no trace?</text>
<line x1="493.0" y1="288.0" x2="500.0" y2="288.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="507.0,288.0 500.0,293.0 500.0,283.0" fill="#94a3b8"/>
<rect x="509.0" y="222.0" width="226.5" height="132.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="535.0" cy="252.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="535.0" y="253.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">6</text>
<text x="559.0" y="260.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Which track</text>
<text x="523.0" y="292.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">The interference is a</text>
<text x="523.0" y="317.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">voice too: which track</text>
<text x="523.0" y="342.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">is the user?</text>
<line x1="737.5" y1="288.0" x2="744.5" y2="288.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="751.5,288.0 744.5,293.0 744.5,283.0" fill="#94a3b8"/>
<rect x="753.5" y="222.0" width="226.5" height="132.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="779.5" cy="252.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="779.5" y="253.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">7</text>
<text x="803.5" y="260.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Who, to whom</text>
<text x="767.5" y="292.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Who spoke when —</text>
<text x="767.5" y="317.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">and was it meant for</text>
<text x="767.5" y="342.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">the system?</text>
</svg>
