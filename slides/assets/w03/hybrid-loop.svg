<text x="576.0" y="94.0" font-size="16" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">one hard path</text>
<text x="576.0" y="118.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">one state per frame, as “truth”</text>
