<text x="460.0" y="124.0" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">argmax</text>
<rect x="760.0" y="70.0" width="164.0" height="64.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="842.0" y="94.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">DNN</text>
<text x="842.0" y="118.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">step 3: per-frame cross-entropy</text>
