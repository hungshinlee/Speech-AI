<text x="112.0" y="94.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">GMM–HMM</text>
<text x="112.0" y="118.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">step 1: Baum–Welch on (X, W)</text>
<rect x="262.0" y="70.0" width="164.0" height="64.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="344.0" y="94.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">forced alignment</text>
<text x="344.0" y="118.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">step 2: Viterbi, words known</text>
<line x1="196.0" y1="102.0" x2="250.0" y2="102.0" stroke="#6b7280" stroke-width="1.6"/>
<polygon points="260.0,102.0 250.0,107.0 250.0,97.0" fill="#6b7280"/>
<text x="228.0" y="124.0" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">already aligns</text>
</g>
<g class="fragment" data-fragment-index="1">
