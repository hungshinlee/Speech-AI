<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 374" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<g class="fragment" data-fragment-index="0">
<text x="20.0" y="30.0" font-size="22" font-weight="700" fill="#0b5cad" text-anchor="start" dominant-baseline="auto">First half</text>
<text x="128.1" y="30.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Who writes the answer for the masked frame?</text>
<rect x="20.0" y="42.0" width="308.0" height="139.0" rx="8" fill="#ffffff" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="46.0" cy="70.0" r="16.0" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.4"/>
<text x="46.0" y="71.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="70.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Contrast</text>
<text x="32.0" y="108.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">The model sets its own quiz,</text>
<text x="32.0" y="133.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">with other pieces of the same</text>
<text x="32.0" y="158.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">utterance as the wrong options.</text>
<text x="32.0" y="183.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">How much can that teach?</text>
<line x1="330.0" y1="111.5" x2="337.0" y2="111.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,111.5 337.0,116.5 337.0,106.5" fill="#94a3b8"/>
<rect x="346.0" y="42.0" width="308.0" height="139.0" rx="8" fill="#ffffff" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="372.0" cy="70.0" r="16.0" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.4"/>
<text x="372.0" y="71.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="396.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Its own answer</text>
<text x="358.0" y="108.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">The model builds the answer</text>
<text x="358.0" y="133.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">itself, and the answer moves.</text>
<text x="358.0" y="158.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What does that cost?</text>
<line x1="656.0" y1="111.5" x2="663.0" y2="111.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,111.5 663.0,116.5 663.0,106.5" fill="#94a3b8"/>
<rect x="672.0" y="42.0" width="308.0" height="139.0" rx="8" fill="#ffffff" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="698.0" cy="70.0" r="16.0" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.4"/>
<text x="698.0" y="71.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="722.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">A teacher</text>
<text x="684.0" y="108.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">A teacher that never moves</text>
<text x="684.0" y="133.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">writes the answers first. How</text>
<text x="684.0" y="158.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">good must it be?</text>
</g>
<g class="fragment" data-fragment-index="1">
<text x="20.0" y="219.0" font-size="22" font-weight="700" fill="#b45309" text-anchor="start" dominant-baseline="auto">Second half</text>
<text x="162.8" y="219.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What that choice decides — and what it does not</text>
<rect x="20.0" y="231.0" width="308.0" height="139.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="46.0" cy="259.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="46.0" y="260.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="70.0" y="267.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The layers</text>
<text x="32.0" y="297.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What does the target do to</text>
<text x="32.0" y="322.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">each layer of the model?</text>
<line x1="330.0" y1="300.5" x2="337.0" y2="300.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,300.5 337.0,305.5 337.0,295.5" fill="#94a3b8"/>
<rect x="346.0" y="231.0" width="308.0" height="139.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="372.0" cy="259.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="372.0" y="260.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="396.0" y="267.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The units</text>
<text x="358.0" y="297.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What are the units the teacher</text>
<text x="358.0" y="322.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">writes down — and what are</text>
<text x="358.0" y="347.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">they not?</text>
<line x1="656.0" y1="300.5" x2="663.0" y2="300.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,300.5 663.0,305.5 663.0,295.5" fill="#94a3b8"/>
<rect x="672.0" y="231.0" width="308.0" height="139.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="698.0" cy="259.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="698.0" y="260.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">6</text>
<text x="722.0" y="267.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Not decided</text>
<text x="684.0" y="297.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Data, domain, the protocol, the</text>
<text x="684.0" y="322.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">clock: what cannot be put down</text>
<text x="684.0" y="347.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">to the target?</text>
</g>
</svg>