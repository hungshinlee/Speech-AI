<text x="694.0" y="74.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="start" dominant-baseline="auto">2 forward passes per step</text>
<text x="694.0" y="100.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">streams</text>
