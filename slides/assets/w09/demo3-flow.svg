<text x="193.2" y="206.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto" textLength="70.5" lengthAdjust="spacing">per clip;</text>
<text x="170.0" y="231.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">threshold 0, fixed in advance</text>
<line x1="324.0" y1="200.0" x2="338.0" y2="200.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="346.0,200.0 338.0,205.0 338.0,195.0" fill="#94a3b8"/>
<rect x="350.0" y="156.0" width="630.0" height="40.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="362.0" y="182.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">the generators: which does it call spoof</text>
<text x="960.0" y="177.0" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">?</text>
<rect x="350.0" y="204.0" width="630.0" height="40.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="362.0" y="230.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">real speech through a codec: bona fide, or spoof</text>
<text x="960.0" y="225.0" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">?</text>
</g>
<g class="fragment" data-fragment-index="2">
<text x="20.0" y="284.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="auto">second half — a watermark, then damage:</text>
<rect x="20.0" y="296.0" width="300.0" height="96.0" rx="6" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.2"/>
<text x="170.0" y="318.0" font-size="19" font-weight="600" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">AudioSeal marks an F5 output</text>
<text x="170.0" y="350.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">keys w, d: A / B, the curve</text>
<text x="170.0" y="375.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">key s: spliced into real speech</text>
<line x1="324.0" y1="344.0" x2="338.0" y2="344.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="346.0,344.0 338.0,349.0 338.0,339.0" fill="#94a3b8"/>
<rect x="350.0" y="296.0" width="300.0" height="96.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="500.0" y="318.0" font-size="19" font-weight="600" fill="#b45309" text-anchor="middle" dominant-baseline="middle">damaged, or generated again</text>
<text x="500.0" y="350.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">a n p: resample, noise, MP3</text>
<text x="500.0" y="375.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">e m v: EnCodec, Mimi, Vocos</text>
<line x1="654.0" y1="344.0" x2="668.0" y2="344.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="676.0,344.0 668.0,349.0 668.0,339.0" fill="#94a3b8"/>
<rect x="680.0" y="296.0" width="300.0" height="96.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="830.0" y="318.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">its detector, per sample</text>
<text x="830.0" y="350.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">blue: the marked audio</text>
<text x="830.0" y="375.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">grey: unmarked, same path</text>
<rect x="20.0" y="404.0" width="960.0" height="36.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="32.0" y="428.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">key b — for each kind of damage: is the mark still detected, and what does the control read</text>
<text x="960.0" y="423.0" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">?</text>
</g>
