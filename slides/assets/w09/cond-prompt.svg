<text x="880.0" y="245.0" font-size="16" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">noise, music</text>
<text x="20.0" y="292.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">W8 p29: a prior large enough to resemble — the same mechanism copies the room, the hum, the mood of that one sentence</text>
<text x="20.0" y="318.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Wang et al. 2024 (flow) · Lu et al. 2025 (LLM-based): a noisy prompt, a degraded output</text>
<text x="20.0" y="346.0" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="auto">"copy only the timbre" is not a promise this scheme can make</text>
