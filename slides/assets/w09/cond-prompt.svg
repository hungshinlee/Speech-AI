<text x="112.0" y="245.0" font-size="16" font-weight="600" fill="#15803d" text-anchor="middle" dominant-baseline="middle">timbre</text>
<rect x="212.0" y="230.0" width="184.0" height="30.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="304.0" y="245.0" font-size="16" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">prosody, emotion</text>
<rect x="404.0" y="230.0" width="184.0" height="30.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="496.0" y="245.0" font-size="16" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">accent</text>
