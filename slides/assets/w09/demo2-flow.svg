<text x="170.0" y="186.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">Whisper writes it down;</text>
<text x="170.0" y="211.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">word errors against the text</text>
<rect x="350.0" y="132.0" width="300.0" height="96.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="500.0" y="154.0" font-size="19" font-weight="600" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle">SIM</text>
<text x="500.0" y="186.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">a speaker encoder:</text>
<text x="500.0" y="211.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">cosine to the prompt</text>
<rect x="680.0" y="132.0" width="300.0" height="96.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="830.0" y="154.0" font-size="19" font-weight="600" fill="#b45309" text-anchor="middle" dominant-baseline="middle">predicted MOS</text>
<text x="830.0" y="186.8" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto">a model trained to predict</text>
