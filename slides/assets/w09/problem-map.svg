<text x="20.0" y="28.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">one generator — and a row of judges, each turning a stretch of sound into one number</text>
<rect x="616.0" y="44.0" width="262.0" height="30.0" rx="6" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.2"/>
<text x="626.0" y="59.0" font-size="16" font-weight="600" fill="#0b5cad" text-anchor="start" dominant-baseline="middle">a frozen ASR (W7)</text>
<text x="886.0" y="59.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">WER</text>
<line x1="580.0" y1="88.0" x2="612.0" y2="59.0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="616.0" y="78.0" width="262.0" height="30.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="626.0" y="93.0" font-size="16" font-weight="600" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">a frozen speaker encoder</text>
<text x="886.0" y="93.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">SIM</text>
<line x1="580.0" y1="88.0" x2="612.0" y2="93.0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="616.0" y="112.0" width="262.0" height="30.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="626.0" y="127.0" font-size="16" font-weight="600" fill="#b45309" text-anchor="start" dominant-baseline="middle">a MOS predictor (W5's SSL)</text>
<text x="886.0" y="127.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">est. MOS</text>
<line x1="580.0" y1="88.0" x2="612.0" y2="127.0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="616.0" y="146.0" width="262.0" height="30.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="626.0" y="161.0" font-size="16" font-weight="600" fill="#15803d" text-anchor="start" dominant-baseline="middle">an emotion classifier, or an LLM</text>
<text x="886.0" y="161.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">obeyed?</text>
<line x1="580.0" y1="88.0" x2="612.0" y2="161.0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="616.0" y="180.0" width="262.0" height="30.0" rx="6" fill="#f1f5f9" stroke="#1f2328" stroke-width="1.2"/>
<text x="626.0" y="195.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="middle">people</text>
<text x="886.0" y="195.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">MOS, A/B</text>
<line x1="580.0" y1="88.0" x2="612.0" y2="195.0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="616.0" y="214.0" width="262.0" height="30.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="626.0" y="229.0" font-size="16" font-weight="600" fill="#dc2626" text-anchor="start" dominant-baseline="middle">a detector</text>
<text x="886.0" y="229.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">real / fake</text>
<line x1="580.0" y1="88.0" x2="612.0" y2="229.0" stroke="#94a3b8" stroke-width="1.0"/>
</g>
<g class="fragment" data-fragment-index="1">
<text x="20.0" y="280.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">four ways the two meet — today's four parts</text>
<rect x="20.0" y="294.0" width="232.0" height="84.0" rx="6" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.3"/>
<text x="136.0" y="314.0" font-size="16" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">side by side, at inference</text>
<text x="136.0" y="338.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">CFG; best-of-N</text>
<text x="136.0" y="362.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">§1–2  whose voice, and how</text>
<rect x="265.0" y="294.0" width="232.0" height="84.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="381.0" y="314.0" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle">as a reward, in training</text>
<text x="381.0" y="338.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">DPO, GRPO, DiffRO</text>
<text x="381.0" y="362.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">§3–4  the judge moves in</text>
<rect x="510.0" y="294.0" width="232.0" height="84.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.3"/>
<text x="626.0" y="314.0" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">after training, to measure</text>
<text x="626.0" y="338.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">evaluation</text>
<text x="626.0" y="362.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">§5  judging the judges</text>
<rect x="755.0" y="294.0" width="232.0" height="84.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<text x="871.0" y="314.0" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">as an adversary</text>
<text x="871.0" y="338.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">detection, watermarks</text>
<text x="871.0" y="362.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">§6  the judge is the opponent</text>
</g>
<g class="fragment" data-fragment-index="2">
<rect x="20.0" y="392.0" width="960.0" height="40.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<text x="500.0" y="412.0" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">the question in every part: who is the judge, what can it not see — and does the generator learn exactly that?</text>
</g>
</svg>
