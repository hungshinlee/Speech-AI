<text x="74.5" y="172.0" font-size="19" font-weight="600" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">the</text>
<text x="74.5" y="196.0" font-size="19" font-weight="600" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">audio</text>
<text x="354.5" y="172.0" font-size="19" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">padding, up to 30 s</text>
<text x="354.5" y="196.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">not drawn — each map prints its share</text>
<text x="20.0" y="258.0" font-size="19" font-weight="400" fill="#0b5cad" text-anchor="start" dominant-baseline="auto">the screen draws only the blue part</text>
