<g class="fragment" data-fragment-index="2">
<text x="20.0" y="314.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="auto">then the ten heads OpenAI's code uses for word timestamps:</text>
<rect x="20.0" y="330.0" width="290.0" height="68.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="165.0" y="351.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">frame the ten</text>
<text x="165.0" y="384.8" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">on the 144 · key 4</text>
<rect x="355.0" y="330.0" width="290.0" height="68.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="500.0" y="351.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">average them, then DTW</text>
<text x="500.0" y="384.8" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">one monotonic path · key 5</text>
