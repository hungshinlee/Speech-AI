</g>
<g class="fragment" data-fragment-index="1">
<text x="20.0" y="122.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="auto">one map: a row per text token, a column per 20 ms frame — keys 2 3 0:</text>
<rect x="20.0" y="136.0" width="560.0" height="96.0" rx="3" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
