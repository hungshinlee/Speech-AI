<text x="300.0" y="126.0" font-size="16" font-weight="700" fill="#0b5cad" text-anchor="start" dominant-baseline="middle">evidence: the sound</text>
<text x="300.0" y="150.0" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">prior: the language</text>
<text x="964.0" y="126.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">every ASR is some way of writing this product</text>
<text x="964.0" y="150.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">the hybrid era had two models for the two terms (W3)</text>
</g>
<g class="fragment" data-fragment-index="2">
<rect x="20.0" y="178.0" width="960.0" height="46.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="36.0" y="192.0" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">1  where does the prior live?</text>
<text x="36.0" y="211.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">none (CTC) · a small network (RNN-T) · the decoder (AED; Whisper's read 680k h) · a text LLM (LLM-based ASR)</text>
<text x="964.0" y="192.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">four paradigms</text>
</g>
<g class="fragment" data-fragment-index="3">
<rect x="20.0" y="228.0" width="960.0" height="46.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="36.0" y="242.0" font-size="17" font-weight="700" fill="#b45309" text-anchor="start" dominant-baseline="middle">2  how strong is it?</text>
<text x="36.0" y="261.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">too little → homophones guessed from sound (W3's hole);  too much → sentences nobody said (hallucination)</text>
<text x="964.0" y="242.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">weak supervision · SSL + fine-tuning</text>
</g>
<g class="fragment" data-fragment-index="4">
<rect x="20.0" y="278.0" width="960.0" height="46.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="36.0" y="292.0" font-size="17" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">3  how are the two combined?</text>
<text x="36.0" y="311.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">decoding: greedy, beam, fusion, the internal LM · biasing: a prior added while it runs</text>
<text x="964.0" y="292.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">prefix beam · fusion · WFST · prompt</text>
</g>
<g class="fragment" data-fragment-index="5">
<rect x="20.0" y="328.0" width="960.0" height="46.0" rx="6" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.2"/>
<text x="36.0" y="342.0" font-size="17" font-weight="700" fill="#0b5cad" text-anchor="start" dominant-baseline="middle">the last question</text>
<text x="36.0" y="361.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">WER counts words — it cannot say whether the prior or the evidence was right</text>
<text x="964.0" y="342.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">evaluation</text>
</g>
</svg>