<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 396" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="984.0" y="22.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="auto">arithmetic from the papers' settings (w07-data.json → token_budget) — not measured</text>
