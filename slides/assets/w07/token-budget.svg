<g class="fragment" data-fragment-index="2">
<text x="350.0" y="315.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="end" dominant-baseline="middle">English text, 2–3 words/s, 1–2 BPE per word</text>
