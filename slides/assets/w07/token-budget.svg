<g class="fragment" data-fragment-index="2">
<rect x="20.0" y="340.0" width="960.0" height="48.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
<text x="500.0" y="354.0" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">after stacking, speech is still 2–4× longer than its own transcript —</text>
<text x="500.0" y="376.0" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">and who decides the rate is now the LLM's context length and its decoding budget</text>
