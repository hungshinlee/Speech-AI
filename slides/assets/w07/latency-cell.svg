<g class="fragment" data-fragment-index="1">
<line x1="244.0" y1="90.0" x2="20.0" y2="130.0" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="394.0" y1="90.0" x2="980.0" y2="130.0" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="20.0" y="130.0" width="960.0" height="112.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="36.0" y="150.0" font-size="17" font-weight="700" fill="#b45309" text-anchor="start" dominant-baseline="middle">this week's cell has three shapes, one per paradigm:</text>
<text x="36.0" y="178.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">streaming RNN-T: emission delay + endpoint — 220 ms median (W4 Demo 2)</text>
<text x="36.0" y="202.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">non-streaming AED: the whole decode — 68 ms p50, whisper.cpp small on this laptop (W1 Demo 2)</text>
<text x="36.0" y="226.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">LLM-based: prefill + first token + one LLM pass per further token — three terms, all growing with the LLM</text>
</g>
<g class="fragment" data-fragment-index="2">
