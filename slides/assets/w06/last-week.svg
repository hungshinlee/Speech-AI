<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 354" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<g class="fragment" data-fragment-index="0">
<text x="20.0" y="24.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">W5: one pipeline, four ways to write the target down</text>
<rect x="20.0" y="38.0" width="225.0" height="92.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="132.0" y="58.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">wav2vec 2.0</text>
<text x="132.0" y="85.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">the model quantises</text>
<text x="132.0" y="110.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">its own latent</text>
<rect x="265.0" y="38.0" width="225.0" height="92.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="377.0" y="58.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">HuBERT</text>
<text x="377.0" y="85.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">offline k-means:</text>
<text x="377.0" y="110.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">cluster id, fixed</text>
<rect x="510.0" y="38.0" width="225.0" height="92.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="622.0" y="58.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">data2vec</text>
<text x="622.0" y="85.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">an EMA of the student</text>
<text x="622.0" y="110.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">on unmasked input</text>
<rect x="755.0" y="38.0" width="225.0" height="92.0" rx="6" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.2"/>
<text x="867.0" y="58.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">BEST-RQ</text>
<text x="867.0" y="85.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">random projection,</text>
<text x="867.0" y="110.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">random codebook</text>
<rect x="20.0" y="144.0" width="960.0" height="44.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="40.0" y="166.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target =</text>
<text x="118.9" y="166.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">what the masked frame is</text>
<text x="365.2" y="166.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">— a unit is</text>
<text x="470.3" y="166.0" font-size="19" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">predicted</text>
</g>
<g class="fragment" data-fragment-index="1">
<rect x="462.3" y="148.0" width="101.3" height="36.0" rx="8" fill="none" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="6 4"/>
<line x1="513.0" y1="188.0" x2="513.0" y2="205.0" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="513.0,214.0 508.0,205.0 518.0,205.0" fill="#dc2626"/>
<rect x="20.0" y="216.0" width="960.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="40.0" y="238.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target =</text>
<text x="118.9" y="238.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">the waveform itself</text>
<text x="301.8" y="238.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">— a token is</text>
<text x="423.7" y="238.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">reconstructed</text>
<text x="40.0" y="290.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">1  the quantiser must carry timbre and phase, not only content</text>
<text x="40.0" y="316.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">2  codes are picked by nearest neighbour — collapse comes back, harder</text>
<text x="40.0" y="342.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">3  the token rate becomes a number somebody designs</text>
</g>
</svg>