<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 346" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="984.0" y="22.0" font-size="15" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="auto">schematic — not a measurement</text>
<g class="fragment" data-fragment-index="0">
<text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">W5: one pipeline, four ways to write the target down</text>
<rect x="20.0" y="50.0" width="220.0" height="74.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="130.0" y="72.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">wav2vec 2.0</text>
<text x="130.0" y="93.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">the model quantises</text>
<text x="130.0" y="110.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">its own latent</text>
<rect x="260.0" y="50.0" width="220.0" height="74.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="370.0" y="72.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">HuBERT</text>
<text x="370.0" y="93.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">offline k-means</text>
<text x="370.0" y="110.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">cluster id, fixed</text>
<rect x="500.0" y="50.0" width="220.0" height="74.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="610.0" y="72.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">data2vec</text>
<text x="610.0" y="93.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">an EMA of the student,</text>
<text x="610.0" y="110.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">unmasked input</text>
<rect x="740.0" y="50.0" width="220.0" height="74.0" rx="6" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.2"/>
<text x="850.0" y="72.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">BEST-RQ</text>
<text x="850.0" y="93.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">a random projection,</text>
<text x="850.0" y="110.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">a random codebook</text>
<rect x="20.0" y="140.0" width="940.0" height="44.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="40.0" y="162.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target = </text>
<text x="120.0" y="162.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">what the masked frame is</text>
<text x="360.0" y="162.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">— a unit is</text>
<text x="462.0" y="162.0" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">predicted</text>
<text x="560.0" y="162.0" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">· no waveform is ever rebuilt · W5 p33</text>
</g>
<g class="fragment" data-fragment-index="1">
<rect x="452.0" y="144.0" width="104.0" height="36.0" rx="8" fill="none" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="6 4"/>
<line x1="500.0" y1="184.0" x2="500.0" y2="205.0" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="500.0,214.0 495.0,205.0 505.0,205.0" fill="#dc2626"/>
<rect x="20.0" y="216.0" width="940.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="40.0" y="238.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target = </text>
<text x="120.0" y="238.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">the waveform itself</text>
<text x="320.0" y="238.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">— a token is</text>
<text x="430.0" y="238.0" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">reconstructed</text>
<text x="580.0" y="238.0" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">· W5 p60's last sentence</text>
<text x="40.0" y="288.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">1  the quantiser must carry timbre and phase, not only content</text>
<text x="40.0" y="310.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">2  no contrastive task helps — collapse comes back, harder</text>
<text x="40.0" y="332.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">3  the token rate becomes a number somebody designs</text>
</g>
</svg>