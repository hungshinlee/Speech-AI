<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 368" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<g class="fragment" data-fragment-index="0">
<text x="20.0" y="34.0" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">W5: one pipeline, four ways to write the target down</text>
<rect x="20.0" y="50.0" width="220.0" height="84.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="130.0" y="72.0" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">wav2vec 2.0</text>
<text x="130.0" y="96.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">the model quantises</text>
<text x="130.0" y="116.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">its own latent</text>
<rect x="260.0" y="50.0" width="220.0" height="84.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="370.0" y="72.0" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">HuBERT</text>
<text x="370.0" y="96.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">offline k-means</text>
<text x="370.0" y="116.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">cluster id, fixed</text>
<rect x="500.0" y="50.0" width="220.0" height="84.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="610.0" y="72.0" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">data2vec</text>
<text x="610.0" y="96.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">an EMA of the student,</text>
<text x="610.0" y="116.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">unmasked input</text>
<rect x="740.0" y="50.0" width="220.0" height="84.0" rx="6" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.2"/>
<text x="850.0" y="72.0" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">BEST-RQ</text>
<text x="850.0" y="96.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">a random projection,</text>
<text x="850.0" y="116.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">a random codebook</text>
<rect x="20.0" y="150.0" width="940.0" height="44.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="40.0" y="172.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target =</text>
<text x="112.0" y="172.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">what the masked frame is</text>
<text x="340.0" y="172.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">— a unit is</text>
<text x="440.0" y="172.0" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">predicted</text>
<text x="540.0" y="172.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">· no waveform is ever rebuilt · W5 p34</text>
</g>
<g class="fragment" data-fragment-index="1">
<rect x="430.0" y="154.0" width="104.0" height="36.0" rx="8" fill="none" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="6 4"/>
<line x1="482.0" y1="194.0" x2="482.0" y2="215.0" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="482.0,224.0 477.0,215.0 487.0,215.0" fill="#dc2626"/>
<rect x="20.0" y="226.0" width="940.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="40.0" y="248.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target =</text>
<text x="112.0" y="248.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">the waveform itself</text>
<text x="300.0" y="248.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">— a token is</text>
<text x="410.0" y="248.0" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">reconstructed</text>
<text x="545.0" y="248.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">· W5 p62's last sentence</text>
<text x="40.0" y="300.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">1  the quantiser must carry timbre and phase, not only content</text>
<text x="40.0" y="324.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">2  no contrastive task helps — collapse comes back, harder</text>
<text x="40.0" y="348.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">3  the token rate becomes a number somebody designs</text>
</g>
</svg>