<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 326" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<g class="fragment" data-fragment-index="0">
<rect x="20.0" y="40.0" width="470.0" height="170.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="36.0" y="64.0" font-size="18" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">acoustic token</text>
<text x="474.0" y="64.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">SoundStream · EnCodec · DAC</text>
<text x="36.0" y="92.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target: the waveform — reconstruction</text>
<text x="36.0" y="122.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">· content + timbre + room + microphone</text>
<text x="36.0" y="148.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">· speaker changes → the distribution moves</text>
<text x="36.0" y="174.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">· rebuilds speech on its own</text>
<rect x="510.0" y="40.0" width="470.0" height="170.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="526.0" y="64.0" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">semantic token</text>
<text x="964.0" y="64.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">W5's unit · w2v-BERT, HuBERT</text>
<text x="526.0" y="92.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="middle">target: the masked frame — prediction</text>
<text x="526.0" y="122.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">· content; speaker reduced, F0 largely absent (W5 p49)</text>
<text x="526.0" y="148.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">· stable across speakers</text>
<text x="526.0" y="174.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">· cannot rebuild speech alone: AudioLM §IV-D</text>
</g>
