<g class="fragment" data-fragment-index="1">
<rect x="20.0" y="222.0" width="960.0" height="36.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="36.0" y="240.0" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle">1  quantiser</text>
<text x="170.0" y="240.0" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">VQ / RVQ / FSQ — how many codebooks, how large</text>
<text x="964.0" y="240.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">collapse lives here</text>
</g>
<g class="fragment" data-fragment-index="2">
<rect x="20.0" y="264.0" width="960.0" height="36.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="36.0" y="282.0" font-size="15" font-weight="700" fill="#b45309" text-anchor="start" dominant-baseline="middle">2  objective</text>
<text x="170.0" y="282.0" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">reconstruction is not enough → discriminators; what is rebuilt decides what a token contains → distillation</text>
<text x="964.0" y="282.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">semantics lives here</text>
</g>
<g class="fragment" data-fragment-index="3">
