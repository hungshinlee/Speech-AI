<text x="20.0" y="368.0" font-size="14" font-weight="700" fill="#0b5cad" text-anchor="start" dominant-baseline="auto">and one piece of arithmetic every design must pass: bitrate · token rate · context for 30 min · decoding steps per second · latency floor</text>
</g>
