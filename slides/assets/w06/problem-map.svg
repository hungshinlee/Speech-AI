<text x="36.0" y="324.0" font-size="15" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">3  frame rate</text>
<text x="170.0" y="324.0" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">75 Hz … 12.5 Hz: kind to the LM, unkind to quality and to the granularity of reaction</text>
<text x="964.0" y="324.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">latency lives here</text>
