<text x="36.0" y="272.0" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">floor: EnCodec 13 ms · SpeechTokenizer 20 ms · Mimi 80 ms — a 12.5 Hz system cannot react to anything within 80 ms</text>
<text x="36.0" y="292.0" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">and W13's full-duplex model decides once per frame: the frame rate is also the granularity of reaction</text>
