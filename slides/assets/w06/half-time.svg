<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 366" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="20.0" y="30.0" font-size="22" font-weight="700" fill="#15803d" text-anchor="start" dominant-baseline="auto">First half — done</text>
<text x="218.9" y="30.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Making the alphabet: a quantiser, then an objective</text>
<rect x="20.0" y="42.0" width="471.0" height="136.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="46.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="46.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="70.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The quantiser</text>
<text x="32.0" y="108.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">By k-means on the latents. It collapses for two</text>
<text x="32.0" y="133.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">reasons: a start outside the data, and updates</text>
<text x="32.0" y="158.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">that touch only winners.</text>
<line x1="493.0" y1="110.0" x2="500.0" y2="110.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="507.0,110.0 500.0,115.0 500.0,105.0" fill="#94a3b8"/>
<rect x="509.0" y="42.0" width="471.0" height="136.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="535.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="535.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="559.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Stacking, and the objective</text>
<text x="521.0" y="108.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Most energy first — not the semantics. The</text>
<text x="521.0" y="133.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">adversary changes what a token carries. Scores</text>
<text x="521.0" y="158.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">do not cross papers.</text>
<text x="20.0" y="216.0" font-size="22" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="auto">Second half — next</text>
<text x="245.6" y="216.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What the alphabet holds — and what it costs</text>
<rect x="20.0" y="228.0" width="308.0" height="136.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="46.0" cy="256.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="46.0" y="257.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="70.0" y="264.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Listen, then count</text>
<text x="32.0" y="294.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What does each stage actually</text>
<text x="32.0" y="319.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">hold?</text>
<line x1="330.0" y1="296.0" x2="337.0" y2="296.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,296.0 337.0,301.0 337.0,291.0" fill="#94a3b8"/>
<rect x="346.0" y="228.0" width="308.0" height="136.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="372.0" cy="256.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="372.0" y="257.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="396.0" y="264.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Voice and words</text>
<text x="358.0" y="294.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Can one alphabet hold both the</text>
<text x="358.0" y="319.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">voice and the words — and</text>
<text x="358.0" y="344.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">where does tone go?</text>
<line x1="656.0" y1="296.0" x2="663.0" y2="296.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,296.0 663.0,301.0 663.0,291.0" fill="#94a3b8"/>
<rect x="672.0" y="228.0" width="308.0" height="136.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="698.0" cy="256.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="698.0" y="257.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="722.0" y="264.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Frame rate</text>
<text x="684.0" y="294.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">How many letters per second</text>
<text x="684.0" y="319.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">— and what does every later</text>
<text x="684.0" y="344.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">week pay?</text>
</svg>