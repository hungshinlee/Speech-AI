<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 364" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<g class="fragment" data-fragment-index="0">
<text x="20.0" y="28.0" font-size="22" font-weight="700" fill="#0b5cad" text-anchor="start" dominant-baseline="auto">First half</text>
<text x="128.1" y="28.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Is the text there — and at which end?</text>
<rect x="20.0" y="40.0" width="308.0" height="132.0" rx="8" fill="#ffffff" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="46.0" cy="70.0" r="16.0" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.4"/>
<text x="46.0" y="71.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="70.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The only interface</text>
<text x="34.0" y="110.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What do the two text links</text>
<text x="34.0" y="135.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">throw away — and what do</text>
<text x="34.0" y="160.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">they keep?</text>
<line x1="330.0" y1="106.0" x2="337.0" y2="106.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,106.0 337.0,111.0 337.0,101.0" fill="#94a3b8"/>
<rect x="346.0" y="40.0" width="308.0" height="132.0" rx="8" fill="#ffffff" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="372.0" cy="70.0" r="16.0" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.4"/>
<text x="372.0" y="71.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="396.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">No text</text>
<text x="360.0" y="110.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">A language model on speech</text>
<text x="360.0" y="135.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">tokens alone: what goes</text>
<text x="360.0" y="160.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">wrong, and why?</text>
<line x1="656.0" y1="106.0" x2="663.0" y2="106.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,106.0 663.0,111.0 663.0,101.0" fill="#94a3b8"/>
<rect x="672.0" y="40.0" width="308.0" height="132.0" rx="8" fill="#ffffff" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="698.0" cy="70.0" r="16.0" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.4"/>
<text x="698.0" y="71.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="722.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Text back: listening</text>
<text x="686.0" y="110.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">A text LLM learns to hear. Is a</text>
<text x="686.0" y="135.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">spoken question answered as</text>
<text x="686.0" y="160.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">well as a typed one?</text>
</g>
<g class="fragment" data-fragment-index="1">
<text x="20.0" y="210.0" font-size="22" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="auto">Second half</text>
<text x="162.8" y="210.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">How far ahead is the text?</text>
<rect x="20.0" y="222.0" width="308.0" height="132.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="46.0" cy="252.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="46.0" y="253.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="70.0" y="260.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Speaking</text>
<text x="34.0" y="292.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Text and speech in one output:</text>
<text x="34.0" y="317.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">in what order — and what does</text>
<text x="34.0" y="342.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">each order cost?</text>
<line x1="330.0" y1="288.0" x2="337.0" y2="288.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,288.0 337.0,293.0 337.0,283.0" fill="#94a3b8"/>
<rect x="346.0" y="222.0" width="308.0" height="132.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="372.0" cy="252.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="372.0" y="253.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="396.0" y="260.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Thinking</text>
<text x="360.0" y="292.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Text that is never spoken:</text>
<text x="360.0" y="317.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">where in time does it go?</text>
<line x1="656.0" y1="288.0" x2="663.0" y2="288.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,288.0 663.0,293.0 663.0,283.0" fill="#94a3b8"/>
<rect x="672.0" y="222.0" width="308.0" height="132.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="698.0" cy="252.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="698.0" y="253.0" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">6</text>
<text x="722.0" y="260.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The bill</text>
<text x="686.0" y="292.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Which cells of the latency</text>
<text x="686.0" y="317.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">budget merged — and which</text>
<text x="686.0" y="342.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">one did not move?</text>
</g>
</svg>
