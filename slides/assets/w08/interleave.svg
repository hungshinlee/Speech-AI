<g class="fragment" data-fragment-index="1">
<line x1="266.0" y1="52.0" x2="266.0" y2="100.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="5 3"/>
<text x="274.0" y="108.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="auto"></text>
<text x="40.0" y="160.0" font-size="16" font-weight="600" fill="#dc2626" text-anchor="start" dominant-baseline="auto">the first packet can leave after the first M speech tokens (0.6 s of speech) — before the LLM has finished the sentence;</text>
<text x="40.0" y="184.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">N : M is a trade: more text per step → better prosody, later first packet; less → earlier, but a reading is committed before the clause is read</text>
<text x="40.0" y="210.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">in a dialogue system the upstream LLM's own N tokens add to the wait (Eq. 12): two first packets of W1's budget, chained</text>
