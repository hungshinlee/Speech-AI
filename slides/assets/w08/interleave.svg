<text x="40.0" y="120.0" font-size="16" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">green: text tokens from the upstream LLM (W1's dialogue system) · purple: speech tokens, each one 40 ms at 25 Hz</text>
