<text x="433.0" y="68.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">LLM prefill</text>
<rect x="502.0" y="46.0" width="110.0" height="44.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="557.0" y="68.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">first token</text>
