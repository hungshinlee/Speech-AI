</g>
<g class="fragment" data-fragment-index="1">
<line x1="616.0" y1="90.0" x2="20.0" y2="130.0" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="806.0" y1="90.0" x2="980.0" y2="130.0" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="20.0" y="130.0" width="960.0" height="112.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.2"/>
<text x="36.0" y="150.0" font-size="17" font-weight="700" fill="#b45309" text-anchor="start" dominant-baseline="middle">this week's cell: three shapes, and one point measured on this laptop</text>
<text x="36.0" y="178.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">whole utterance, one shot: the first packet is the whole synthesis — Kokoro 124 ms p50 here (W1 Demo 2); F5 measured in Demo 2</text>
<text x="36.0" y="202.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">AR + chunk decoder: C tokens, then the flow and the vocoder on that chunk — independent of sentence length; RTF &lt; 1 after</text>
<text x="36.0" y="226.0" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="middle">dual-track to waveform: a few LM steps + the codec decoder — 97 ms reported for Qwen3-TTS-0.6B, with its conditions</text>
</g>
<g class="fragment" data-fragment-index="2">
<rect x="20.0" y="256.0" width="960.0" height="32.0" rx="5" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.0"/>
<text x="500.0" y="272.0" font-size="16" font-weight="600" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">W6 put the floor 1 / f_r in this cell; W11 merges it with 'first token': an audio-native LM's first speech token is its first packet</text>
</g>
