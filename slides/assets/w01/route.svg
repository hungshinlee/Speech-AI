<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 392" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<g class="fragment" data-fragment-index="0">
<text x="20.0" y="30.0" font-size="22" font-weight="700" fill="#0b5cad" text-anchor="start" dominant-baseline="auto">First half</text>
<text x="128.1" y="30.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">The question, and the systems that try to answer it</text>
<rect x="20.0" y="42.0" width="471.0" height="110.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="46.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="46.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="70.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The course</text>
<text x="32.0" y="108.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Where the question lives: fourteen weeks, three</text>
<text x="32.0" y="133.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">axes</text>
<line x1="493.0" y1="97.0" x2="500.0" y2="97.0" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="507.0,97.0 500.0,102.0 500.0,92.0" fill="#94a3b8"/>
<rect x="509.0" y="42.0" width="471.0" height="110.0" rx="8" fill="#ffffff" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="535.0" cy="70.0" r="16.0" fill="#dbeafe" stroke="#0b5cad" stroke-width="1.4"/>
<text x="535.0" y="71.0" font-size="19" font-weight="700" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="559.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Architectures</text>
<text x="521.0" y="108.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">Three architectures: what does each one give up</text>
<text x="521.0" y="133.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">to get both right?</text>
</g>
<g class="fragment" data-fragment-index="1">
<text x="20.0" y="190.0" font-size="22" font-weight="700" fill="#b45309" text-anchor="start" dominant-baseline="auto">Second half</text>
<text x="162.8" y="190.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">How we know it is right: a human clock, a budget, a second speaker</text>
<rect x="20.0" y="202.0" width="308.0" height="135.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="46.0" cy="230.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="46.0" y="231.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="70.0" y="238.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The human target</text>
<text x="32.0" y="268.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What humans aim at: how late</text>
<text x="32.0" y="293.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">is too late?</text>
<line x1="330.0" y1="269.5" x2="337.0" y2="269.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,269.5 337.0,274.5 337.0,264.5" fill="#94a3b8"/>
<rect x="346.0" y="202.0" width="308.0" height="135.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="372.0" cy="230.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="372.0" y="231.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="396.0" y="238.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The budget</text>
<text x="358.0" y="268.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">The latency budget: where</text>
<text x="358.0" y="293.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">does the machine's time go?</text>
<line x1="656.0" y1="269.5" x2="663.0" y2="269.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,269.5 663.0,274.5 663.0,264.5" fill="#94a3b8"/>
<rect x="672.0" y="202.0" width="308.0" height="135.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="698.0" cy="230.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="698.0" y="231.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="722.0" y="238.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Behaviours</text>
<text x="684.0" y="268.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">When the user is also talking:</text>
<text x="684.0" y="293.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">what does doing it right look</text>
<text x="684.0" y="318.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">like?</text>
</g>
