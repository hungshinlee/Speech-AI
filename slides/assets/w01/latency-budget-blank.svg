<text x="313.6" y="166.0" font-size="20" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<rect x="412.8" y="68.0" width="174.4" height="72" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
