<text x="872.8" y="166.0" font-size="20" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<line x1="40.0" y1="192.0" x2="406.8" y2="192.0" stroke="#0b5cad" stroke-width="1.4"/>
<text x="223.4" y="216.0" font-size="17" fill="#0b5cad" text-anchor="middle">algorithmic — lookahead; no hardware fixes this</text>
<line x1="406.8" y1="192.0" x2="960.0" y2="192.0" stroke="#b45309" stroke-width="1.4"/>
<text x="683.4" y="216.0" font-size="17" fill="#b45309" text-anchor="middle">computational — scales with model size and batching</text>
<text x="40.0" y="260.0" font-size="20" font-weight="700" fill="#1f2328">total = ______ ms</text>
<rect x="290.0" y="236.0" width="340" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="460.0" y="258.0" font-size="17.5" fill="#15803d" text-anchor="middle">humans: modal turn gap ≈ 0 ms</text>
<text x="500.0" y="296.0" font-size="17" fill="#6b7280" text-anchor="middle">Stivers et al., PNAS 2009 (10 languages): cross-language means differ by at most ±250 ms;</text>
<text x="500.0" y="317.0" font-size="17" fill="#6b7280" text-anchor="middle">dispreferred answers are delayed up to ~1 s — delay itself carries meaning.</text>
