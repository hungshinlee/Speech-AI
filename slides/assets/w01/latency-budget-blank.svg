<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="40" y="34" font-size="18" font-weight="700" fill="#1f2328">Latency budget — we refill this every week</text>
<text x="960.0" y="34.0" font-size="13" fill="#6b7280" text-anchor="end">widths are placeholders, not measurements</text>
<rect x="40.0" y="85.0" width="174.4" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="127.2" y="108.0" font-size="13.5" fill="#1f2328" text-anchor="middle">endpoint</text>
<text x="127.2" y="124.0" font-size="13.5" fill="#1f2328" text-anchor="middle">detection</text>
<text x="127.2" y="170.0" font-size="16" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<rect x="226.4" y="85.0" width="174.4" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="313.6" y="108.0" font-size="13.5" fill="#1f2328" text-anchor="middle">ASR tail</text>
<text x="313.6" y="170.0" font-size="16" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<rect x="412.8" y="85.0" width="174.4" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="500.0" y="108.0" font-size="13.5" fill="#1f2328" text-anchor="middle">LLM prefill</text>
<text x="500.0" y="124.0" font-size="13.5" fill="#1f2328" text-anchor="middle">+ first token</text>
<text x="500.0" y="170.0" font-size="16" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<rect x="599.2" y="85.0" width="174.4" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="686.4" y="108.0" font-size="13.5" fill="#1f2328" text-anchor="middle">TTS</text>
<text x="686.4" y="124.0" font-size="13.5" fill="#1f2328" text-anchor="middle">first packet</text>
<text x="686.4" y="170.0" font-size="16" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<rect x="785.6" y="85.0" width="174.4" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="872.8" y="108.0" font-size="13.5" fill="#1f2328" text-anchor="middle">playout</text>
<text x="872.8" y="124.0" font-size="13.5" fill="#1f2328" text-anchor="middle">buffer</text>
<text x="872.8" y="170.0" font-size="16" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<line x1="40.0" y1="192.0" x2="406.8" y2="192.0" stroke="#0b5cad" stroke-width="1.4"/>
<text x="223.4" y="212.0" font-size="13" fill="#0b5cad" text-anchor="middle">algorithmic — lookahead; no hardware fixes this</text>
<line x1="406.8" y1="192.0" x2="960.0" y2="192.0" stroke="#b45309" stroke-width="1.4"/>
<text x="683.4" y="212.0" font-size="13" fill="#b45309" text-anchor="middle">computational — scales with model size and batching</text>
<text x="40.0" y="246.0" font-size="16" font-weight="700" fill="#1f2328">total = ______ ms</text>
<rect x="230.0" y="227.0" width="290" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="375.0" y="245.0" font-size="13.5" fill="#15803d" text-anchor="middle">humans: modal turn gap ≈ 0 ms</text>
<text x="500.0" y="276.0" font-size="13" fill="#6b7280" text-anchor="middle">Stivers et al., PNAS 2009 (10 languages): cross-language means differ by at most ±250 ms;</text>
<text x="500.0" y="294.0" font-size="13" fill="#6b7280" text-anchor="middle">dispreferred answers are delayed up to ~1 s — delay itself carries meaning.</text>
</svg>