<rect x="599.2" y="68.0" width="174.4" height="72" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="686.4" y="94.0" font-size="17.5" fill="#1f2328" text-anchor="middle">TTS</text>
<text x="686.4" y="115.0" font-size="17.5" fill="#1f2328" text-anchor="middle">first packet</text>
<text x="686.4" y="166.0" font-size="20" font-weight="700" fill="#6b7280" text-anchor="middle">____ ms</text>
<rect x="785.6" y="68.0" width="174.4" height="72" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
