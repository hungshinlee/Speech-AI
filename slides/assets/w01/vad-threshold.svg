<text x="650.0" y="78.0" font-size="15" font-weight="400" fill="#0b5cad" text-anchor="middle" dominant-baseline="middle">“… Tainan, next Wednesday.”</text>
<text x="778.0" y="78.0" font-size="14" font-weight="600" fill="#6b7280" text-anchor="start" dominant-baseline="middle">finished</text>
<line x1="455.0" y1="98.0" x2="455.0" y2="318.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
