<text x="815.0" y="182.0" font-size="14" font-weight="600" fill="#15803d" text-anchor="middle" dominant-baseline="auto">reply at +300 ms</text>
</g>
<g class="fragment" data-fragment-index="1">
<text x="216.0" y="240.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="end" dominant-baseline="middle">threshold 700 ms</text>
