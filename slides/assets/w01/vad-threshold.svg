<text x="500.0" y="382.0" font-size="15" fill="#6b7280" text-anchor="middle">A silence timer sees two silences of different length.</text>
<text x="500.0" y="402.0" font-size="15" fill="#6b7280" text-anchor="middle">It cannot see that one is inside a sentence and the other is after it.</text>
