<text x="507.5" y="240.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">700</text>
<text x="570.0" y="240.0" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">survives the pause</text>
<rect x="770.0" y="226.0" width="105.0" height="28.0" rx="2" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="822.5" y="240.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">700</text>
<circle cx="875.0" cy="240.0" r="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="905.0" y="272.0" font-size="14" font-weight="600" fill="#15803d" text-anchor="end" dominant-baseline="auto">reply at +700 ms — feels slow</text>
