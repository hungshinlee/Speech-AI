<text x="500.0" y="182.0" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="auto">fires inside the sentence → cut off</text>
<rect x="770.0" y="136.0" width="45.0" height="28.0" rx="2" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
