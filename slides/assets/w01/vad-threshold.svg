<line x1="380.0" y1="317.0" x2="380.0" y2="327.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="380.0" y="344.0" font-size="14" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="auto">1000 ms</text>
