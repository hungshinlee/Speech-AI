<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 392" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="20.0" y="30.0" font-size="22" font-weight="700" fill="#15803d" text-anchor="start" dominant-baseline="auto">First half — done</text>
<text x="218.9" y="30.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">The question, and the systems that try to answer it</text>
<rect x="20.0" y="42.0" width="471.0" height="135.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="46.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="46.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="70.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The course</text>
<text x="32.0" y="108.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Fourteen weeks with W6 as the hinge; three axes</text>
<text x="32.0" y="133.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">asked every week — representation, latency,</text>
<text x="32.0" y="158.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">supervision.</text>
<line x1="493.0" y1="109.5" x2="500.0" y2="109.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="507.0,109.5 500.0,114.5 500.0,104.5" fill="#94a3b8"/>
<rect x="509.0" y="42.0" width="471.0" height="135.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<circle cx="535.0" cy="70.0" r="16.0" fill="#15803d" stroke="#15803d" stroke-width="1.4"/>
<text x="535.0" y="71.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">✓</text>
<text x="559.0" y="78.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Architectures</text>
<text x="521.0" y="108.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The cascade loses the clock at the transcript.</text>
<text x="521.0" y="133.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">End-to-end keeps it and pays in semantics.</text>
<text x="521.0" y="158.0" font-size="19" font-weight="400" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Native full duplex turns silence into a token.</text>
<text x="20.0" y="215.0" font-size="22" font-weight="700" fill="#b45309" text-anchor="start" dominant-baseline="auto">Second half — next</text>
<text x="245.6" y="215.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">How we know it is right: a human clock, a budget, a second speaker</text>
<rect x="20.0" y="227.0" width="308.0" height="135.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="46.0" cy="255.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="46.0" y="256.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="70.0" y="263.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The human target</text>
<text x="32.0" y="293.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">What humans aim at: how late</text>
<text x="32.0" y="318.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">is too late?</text>
<line x1="330.0" y1="294.5" x2="337.0" y2="294.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="344.0,294.5 337.0,299.5 337.0,289.5" fill="#94a3b8"/>
<rect x="346.0" y="227.0" width="308.0" height="135.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="372.0" cy="255.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="372.0" y="256.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="396.0" y="263.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">The budget</text>
<text x="358.0" y="293.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">The latency budget: where</text>
<text x="358.0" y="318.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">does the machine's time go?</text>
<line x1="656.0" y1="294.5" x2="663.0" y2="294.5" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="670.0,294.5 663.0,299.5 663.0,289.5" fill="#94a3b8"/>
<rect x="672.0" y="227.0" width="308.0" height="135.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<circle cx="698.0" cy="255.0" r="16.0" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="698.0" y="256.0" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="722.0" y="263.0" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="auto">Behaviours</text>
<text x="684.0" y="293.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">When the user is also talking:</text>
<text x="684.0" y="318.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">what does doing it right look</text>
<text x="684.0" y="343.0" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="auto">like?</text>
</svg>