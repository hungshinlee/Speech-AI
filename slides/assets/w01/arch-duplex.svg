<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="100%" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="530.0" y="40.0" font-size="15" fill="#1f2328" text-anchor="middle">Silence is a token the model must emit. Full duplex is not a scheduler bolted on — it is sequence modelling.</text>
<rect x="26.0" y="95.0" width="124.0" height="50.0" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="88.0" y="114.0" font-size="17" font-weight="650" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">User</text>
<text x="88.0" y="134.0" font-size="13" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">channel 0</text>
<rect x="158.0" y="111.0" width="211.0" height="18.0" fill="#0b5cad" opacity=".9"/>
<polygon points="369.0,111.0 380.0,120.0 369.0,129.0" fill="#0b5cad"/>
<text x="263.5" y="102.0" font-size="12.5" fill="#0b5cad" text-anchor="middle">audio</text>
<rect x="380.0" y="101.0" width="300.0" height="150.0" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="530.0" y="152.0" font-size="19" font-weight="650" fill="#1f2328" text-anchor="middle">Full-duplex LM</text>
<text x="530.0" y="178.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">one step per frame</text>
<text x="530.0" y="204.0" font-size="14" font-weight="600" fill="#0b5cad" text-anchor="middle">speak · stay silent · keep listening</text>
<rect x="680.0" y="226.0" width="112.0" height="12.0" fill="#7c3aed" opacity=".9"/>
<polygon points="792.0,223.0 803.0,232.0 792.0,241.0" fill="#7c3aed"/>
<text x="736.0" y="217.0" font-size="12.5" fill="#7c3aed" text-anchor="middle">speech tokens</text>
<rect x="800.0" y="207.0" width="140.0" height="50.0" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="870.0" y="232.0" font-size="17" font-weight="650" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Codec dec.</text>
<rect x="948.0" y="223.0" width="72.0" height="18.0" fill="#0b5cad" opacity=".9"/>
<polygon points="1020.0,223.0 1031.0,232.0 1020.0,241.0" fill="#0b5cad"/>
<text x="984.0" y="214.0" font-size="12.5" fill="#0b5cad" text-anchor="middle">audio</text>
<text x="984.0" y="258.0" font-size="12.5" fill="#6b7280" text-anchor="middle">channel 1</text>
<path d="M 1020 262.0 L 1020 310.0 L 512 310.0 L 512 264.0" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="512.0,252.0 506.0,265.0 518.0,265.0" fill="#6b7280"/>
<text x="772.0" y="299.0" font-size="13" fill="#6b7280" text-anchor="middle">the model hears itself → acoustic echo cancellation is mandatory (W10)</text>
<text x="530.0" y="78.0" font-size="14" fill="#6b7280" text-anchor="middle">Input never stops entering the computation, not even while the model speaks.</text>
