project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - syllabus.qmd
    - resources.qmd
    - slides.qmd
    - supplements.qmd
    - supplements/*.qmd
    - weeks/w*.qmd          # all.qmd 已不再產生，也不上網站
    - slides/*.qmd
  resources:
    - slides/assets/**

lang: zh-Hant

# 網站骨架一律英文：覆寫 Quarto 內建的中文 UI 字串。
# 頁內 TOC 標題見 format.html 的 toc-title。
language:
  search-text-placeholder: "Search"
  repo-action-links-source: "View source"
  repo-action-links-issue: "Report an issue"
  back-to-top-title: "Back to top"

website:
  title: "語音處理與人機互動"
  description: "A graduate course built backwards from one goal: a half- and full-duplex spoken dialogue AI system"
  site-url: https://hungshinlee.github.io/Speech-AI/
  repo-url: https://github.com/hungshinlee/Speech-AI
  repo-actions: [source, issue]
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: ""
    title: "語音處理與人機互動"
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: slides.qmd
        text: Slides
      - href: resources.qmd
        text: Resources
      - href: supplements.qmd
        text: Supplements
    right:
      - icon: github
        href: https://github.com/hungshinlee/Speech-AI
        aria-label: GitHub
  sidebar:
    style: floating
    collapse-level: 2
    search: false
    contents:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: slides.qmd
        text: Slides
      - section: "Part I — Foundations"
        contents:
          - href: weeks/w01.qmd
          - href: weeks/w02.qmd
          - href: weeks/w03.qmd
          - href: weeks/w04.qmd
          - href: weeks/w05.qmd
          - href: weeks/w06.qmd
      - section: "Part II — Modules"
        contents:
          - href: weeks/w07.qmd
          - href: weeks/w08.qmd
          - href: weeks/w09.qmd
          - href: weeks/w10.qmd
      - section: "Part III — Dialogue Systems"
        contents:
          - href: weeks/w11.qmd
          - href: weeks/w12.qmd
          - href: weeks/w13.qmd
          - href: weeks/w14.qmd
      - href: resources.qmd
        text: Resources
      - section: "Supplements"
        href: supplements.qmd
        contents:
          - href: supplements/topics-for-interspeech27.qmd
          - href: supplements/midterm-poc.qmd
          - href: supplements/final-paper-mvp.qmd
          - href: supplements/paper-writing-and-narrative.qmd
  page-footer:
    left: "語音處理與人機互動 · Speech Processing and Human-Machine Interaction · 14 weeks"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    toc-expand: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    # 釘住版本：Quarto 預設載 katex@latest，上游改版會無聲壞掉
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/"
    code-copy: true
    code-overflow: scroll
    fig-responsive: true
    grid:
      sidebar-width: 260px
      body-width: 960px
      margin-width: 220px
