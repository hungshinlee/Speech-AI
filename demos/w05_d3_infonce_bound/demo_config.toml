# 此檔由 bin/publish_demos.py 從 private repo 的 <course>/demos/ 複製而來，請勿在公開 repo 直接編輯。
# W5 demo 3：InfoNCE 的天花板。換內容只改這裡。
#
# [sweep] 的五個值（seed、d、rho、Ns、steps／lr／eval_batches）與 slides/scripts/make_figs_w05.py 的 infonce_sweep() 預設值相同，
# 改了任何一個，鍵 2 的曲線就不再是投影片 p13 那一條，selftest 也會對不上 w05-data.json。
# 要換就連 make_figs_w05.py 一起換、重產圖、重跑 publish.py。

[sweep]
seed = 20261011
d = 8                 # 高斯對的維度；真值 I = −(d/2) ln(1 − ρ²)
rho = 0.7             # 每一維的相關係數；d = 8、ρ = 0.7 → I = 2.6934 nat
Ns = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]   # 一個 batch 的 pair 數 = 一個正樣本 + N − 1 個負樣本
steps = 3000          # Adam 步數，每步一個新 batch
lr = 0.01
eval_batches = 200    # 訓完後在幾個 held-out batch 上算 L_N；估計值 = ln N − 平均 L_N，std 也在這些 batch 上算

[variance]
# 鍵 3：畫哪幾個 N 的 per-batch 估計值直方圖（必須在 sweep.Ns 裡）。講稿引的是 2 的 0.35 與 1024 的 0.06。
Ns = [2, 32, 1024]

[bilinear]
# 鍵 b：純雙線性 critic（a ≡ 0）在哪幾個 N 對照。另一條 rng（seed + 1），不影響鍵 2 與 json 的對應。
Ns = [8, 128, 1024]

[selftest]
tolerance = 1e-9      # 與 w05-data.json 的容忍差：Linux OpenBLAS 與 macOS Accelerate 的加總順序不同，最後幾位可能不同
bilinear_N = 128      # selftest 裡只對一個 N 查「純雙線性比多一項鬆」

[display]
digits = 3            # 終端機印幾位小數（json 存全精度）
plot = true           # false = 只在終端機，不開 matplotlib 視窗（等同 --no-plot）
